repos:
  - repo: local
    hooks:
      - id: local-pre-commit
        name: local-pre-commit
        entry: .github/hooks/run_hook.sh "pre_commit"
        language: script
        pass_filenames: false
        verbose: true

      - id: ruff
        name: ruff
        entry: .github/hooks/ruff.sh
        language: script
        pass_filenames: false
        verbose: true

      - id: verilator-lint
        name: verilator-lint
        description: Runs verilator to lint System Verilog designs
        entry: .github/hooks/verilator.sh
        language: script
        pass_filenames: false
        verbose: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        exclude: '^(.*\.flac)$'
        args: ['--maxkb=512']
      - id: check-ast
      - id: check-builtin-literals
        args: ['--no-allow-dict-kwargs']
      - id: check-docstring-first
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: debug-statements
      - id: detect-private-key
      - id: double-quote-string-fixer
      - id: mixed-line-ending
        args: ['--fix', 'lf']
      - id: name-tests-test
      - id: pretty-format-json
        args: ['--autofix', '--indent', '4', '--no-ensure-ascii', '--no-sort-keys']
      - id: requirements-txt-fixer
